# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: Build for commit

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # https://github.com/chalk/supports-color/blob/main/index.js#L21
      # https://github.com/chalk/supports-color/blob/main/index.js#L54
      FORCE_COLOR: 1
      # https://playwright.dev/docs/browsers#skip-browser-downloads
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v4
        with:
          # Number of commits to fetch. 0 indicates all history.
          fetch-depth: 1
          lfs: true

      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@v2
        with:
          version: 9.6.0

      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      - name: Setup Bun
        # https://github.com/oven-sh/setup-bun/tree/v2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Environment variables
        run: |
          env

      - name: Install
        run: |
          pnpm i --frozen-lockfile

      # Runs the `test` script of every workspace package that defines one.
      - name: Test
        run: |
          pnpm test

      # scripts/build.ts: a deck with its own `build` script (e.g. one that builds data first) runs it, others get `slidev build`.
      - name: Build site
        run: |
          pnpm build

      # Cloudflare Pages, as a Direct Upload of the built `.site/`: the host has to send the response headers in
      # public/_headers (terminal-glance's cross-origin isolation).
      # https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
      - name: Deploy site
        if: ${{ github.ref == 'refs/heads/master' }}
        # https://github.com/cloudflare/wrangler-action
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .site --project-name=slides --branch=master
