# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: Build for commit

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # https://github.com/chalk/supports-color/blob/main/index.js#L21
      # https://github.com/chalk/supports-color/blob/main/index.js#L54
      FORCE_COLOR: 1
      # https://playwright.dev/docs/browsers#skip-browser-downloads
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v4
        with:
          # Number of commits to fetch. 0 indicates all history.
          fetch-depth: 1
          lfs: true

      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@v2
        with:
          version: 9.6.0

      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      - name: Setup Bun
        # https://github.com/oven-sh/setup-bun/tree/v2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Environment variables
        run: |
          env

      - name: Install
        run: |
          pnpm i --frozen-lockfile

      - name: Test terminal-glance
        run: |
          pnpm -C present/terminal-glance test

      # present/terminal-glance boots a guest disk built here on every push (see present/terminal-glance/docs/image.md).
      - name: Build terminal-glance guest image
        # Its VM driver needs Node >= 24 (WebAssembly JSPI); the script falls back to `npx -y node@24`.
        run: |
          pnpm -C present/terminal-glance build:image

      - name: Build site
        run: |
          pnpm build

      - name: Deploy site
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.site
          # One commit on gh-pages, so the guest disk chunks of old builds do not pile up in its history.
          force_orphan: true
